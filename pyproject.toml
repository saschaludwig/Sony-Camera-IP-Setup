[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sony-camera-ip-setup"
version = "1.0.0"
description = "Sony Camera IP Setup — unofficial RM-IP Setup alternative for macOS and Linux."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sascha Ludwig", email = "Sascha.Ludwig@astrastudio.de" },
    { name = "astrastudio broadcast solutions" },
]
keywords = ["sony", "visca", "ptz", "rm-ip", "srg", "camera"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/saschaludwig/Sony-Camera-IP-Setup"
Repository = "https://github.com/saschaludwig/Sony-Camera-IP-Setup"
Issues = "https://github.com/saschaludwig/Sony-Camera-IP-Setup/issues"

[project.scripts]
sony-camera-ip-setup = "sony_camera_ip_setup:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
